name: Verify Pull Request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Compile
        uses: ./.github/actions/compile
        with:
          log-directory: build/ci-logs

      - name: Lint
        uses: ./.github/actions/lint
        with:
          log-directory: build/ci-logs

      - name: Test
        uses: ./.github/actions/test
        with:
          log-directory: build/ci-logs

      - name: Upload Gradle reports after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-${{ matrix.os }}
          path: |
            build/ci-logs
            build/reports
            build/test-results
            build/jacoco
          if-no-files-found: ignore
