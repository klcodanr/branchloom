name: Build Release Installers

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-build
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Compile
        uses: ./.github/actions/compile

      - name: Lint
        uses: ./.github/actions/lint

      - name: Test
        uses: ./.github/actions/test

  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: verify
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate UTC release version
        id: version
        shell: bash
        run: |
          value=$(date -u +'%Y%m%d.%H%M%S')
          tag="v${value}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Reserve release version
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: echo "Reserved release version $RELEASE_TAG"

  build:
    needs: prepare
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS
          - os: ubuntu-24.04
            platform: Linux

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Validate and read release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: v${{ needs.prepare.outputs.value }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]{8}\.[0-9]{6}$ ]]; then
            echo "Release tag must use the UTC timestamp format vYYYYMMDD.HHMMSS: $RELEASE_TAG"
            exit 1
          fi
          echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build native installer
        run: gradle --no-daemon "-PreleaseVersion=${{ steps.version.outputs.value }}" jpackageInstaller

      - name: Stage installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: build/jpackage/*
          if-no-files-found: error

  release:
    name: Create release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [prepare, build]
    outputs:
      tag: ${{ needs.prepare.outputs.tag }}
      value: ${{ needs.prepare.outputs.value }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and push release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release
          merge-multiple: true

      - name: Attach installers to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/*

  publish-cask:
    needs: release
    name: Publish Homebrew cask
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download macOS installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'Branchloom-*.dmg' \
            --dir release

      - name: Calculate installer checksum
        id: checksum
        shell: bash
        run: |
          installer=$(printf '%s\n' release/*.dmg)
          echo "sha256=$(sha256sum "$installer" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: klcodanr/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.value }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          mkdir -p tap/Casks
          cat > tap/Casks/branchloom.rb <<EOF
          cask "branchloom" do
            version "$RELEASE_VERSION"
            sha256 "$SHA256"

            url "https://github.com/klcodanr/branchloom/releases/download/v#{version}/Branchloom-#{version}.dmg"
            name "Branchloom"
            desc "Desktop application for organizing Git projects and agent sessions"
            homepage "https://github.com/klcodanr/branchloom"

            app "Branchloom.app"
          end
          EOF

      - name: Commit cask update
        working-directory: tap
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.value }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Casks/branchloom.rb
          git commit -m "Update branchloom to $RELEASE_VERSION" || exit 0
          git push
