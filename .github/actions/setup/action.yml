name: Set up build environment
description: Configure Java, Gradle, virtual display, and CI artifact directories
runs:
  using: composite
  steps:
    - name: Set up Java 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '9.7.1'

    - name: Set up virtual display
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes xvfb

    - name: Prepare CI artifact directory
      shell: bash
      run: mkdir -p build/ci-logs
